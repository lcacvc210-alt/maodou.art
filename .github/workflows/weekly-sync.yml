name: Sync official weekly calendar

on:
  schedule:
    # Sunday previews the next week. Mon-Sat refresh the current week.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      preview_week:
        description: 'Optional Monday (YYYY-MM-DD); preview only, without publishing'
        type: string
        required: false

concurrency:
  group: weekly-calendar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.WEEKLY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync official releases
        env:
          PREVIEW_WEEK: ${{ inputs.preview_week }}
        run: |
          node --test scripts/sync-weekly.test.mjs
          if [ -n "$PREVIEW_WEEK" ]; then
            node scripts/sync-weekly.mjs --week "$PREVIEW_WEEK"
          else
            node scripts/sync-weekly.mjs --write
          fi
      - name: Publish calendar changes
        if: inputs.preview_week == ''
        env:
          AUTHOR_NAME: ${{ vars.WEEKLY_SYNC_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.WEEKLY_SYNC_AUTHOR_EMAIL }}
        run: |
          if git diff --quiet -- public/weekly/data/events.json; then
            exit 0
          fi
          test -n "$AUTHOR_NAME"
          test -n "$AUTHOR_EMAIL"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -- public/weekly/data/events.json
          git commit -m "Update weekly calendar from official releases"
          git push origin HEAD:main
